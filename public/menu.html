<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Menu - NEXA</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body{background:#111214;color:#f7f3e8}
    .wrap{max-width:1180px;margin:0 auto;padding:22px 16px 40px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .brand{font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .sub{color:#b7b0a3;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    .muted{color:var(--muted)}
    .right{display:flex;align-items:center;gap:10px}
    .right a{color:#d8cfbd;text-decoration:none}
    .right a:hover{color:#fff7e5}
    .langBtn{border:1px solid rgba(247,243,232,.18);background:#191a1d;color:#fff7e5;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:800;letter-spacing:.04em}
    .menuIntro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px;padding:18px;border:1px solid rgba(247,243,232,.12);border-radius:8px;background:linear-gradient(135deg,#17181b,#20211f 58%,#1c2420)}
    .menuKicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9fd3a9;font-weight:900}
    .menuIntro h1{margin:6px 0 0;font-size:clamp(28px,6vw,56px);line-height:.95;letter-spacing:0;text-transform:none;color:#fff7e5}
    .menuIntro p{margin:10px 0 0;color:#d7cfbf;max-width:58ch;line-height:1.45}
    .menuContext{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .menuContextItem{border:1px solid rgba(247,243,232,.12);background:#111214;border-radius:8px;padding:9px 11px;color:#d7cfbf;font-size:13px}
    .menuContextItem span{display:block;color:#9fd3a9;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:950;margin-bottom:3px}
    .menuContextItem strong{color:#fff7e5;font-size:14px}
    .menuIntroMeta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .menuPill{border:1px solid rgba(247,243,232,.14);background:#111214;color:#fff7e5;border-radius:8px;padding:9px 11px;font-weight:850;font-size:12px}
    .menuPill strong{color:#9fd3a9}
    .menuTileDesc{color:#c7beb0;font-size:13px;line-height:1.4;margin-top:2px}
    .menuEmpty{padding:18px;border:1px dashed rgba(247,243,232,.18);border-radius:8px;background:#17181b;color:#d7cfbf}
    .menuRequest{margin-top:14px;border-radius:8px;background:#17181b;border-color:rgba(159,211,169,.28)}
    .menuRequest .menuTitle{color:#fff7e5}
    .menuRequest .input{border-radius:8px}
    .menuRequest .btn{border-radius:8px}
    .menuBoard{grid-template-columns:210px 1fr;gap:14px}
    .menuSidebar{border-radius:8px;background:#17181b;border-color:rgba(247,243,232,.12);padding:12px;box-shadow:none}
    .menuSidebar #cats{display:flex;flex-direction:column;gap:8px}
    .menuSideTitle{color:#9fd3a9;font-weight:900;letter-spacing:.16em}
    .menuCat{border-radius:8px;padding:12px;border-color:var(--cat-border, rgba(247,243,232,.12));background:var(--cat-bg, #202124);box-shadow:none;font-weight:850;color:#fff7e5;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .menuCat span{overflow:hidden;text-overflow:ellipsis}
    .menuCat.active{box-shadow:0 0 0 2px var(--cat-ring, rgba(159,211,169,.14));background:#24251f}
    .menuContent{border-radius:8px;background:#151619;border-color:rgba(247,243,232,.12);padding:14px;box-shadow:none}
    .menuTop{border-bottom:1px solid rgba(247,243,232,.1);padding-bottom:12px}
    .menuTitle{font-size:14px;letter-spacing:.12em;color:#fff7e5}
    .menuGrid{margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
    .menuTile{border-radius:8px;background:#1b1c1f;border-color:rgba(247,243,232,.12);box-shadow:none;padding:10px;gap:10px;min-height:0;overflow:hidden}
    .menuTileThumb{height:150px;border-radius:8px;border:1px solid rgba(247,243,232,.12);background:#252622;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#9fd3a9;font-weight:950;font-size:34px}
    .menuTileInfo{display:flex;flex-direction:column;gap:6px}
    .menuTileHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .menuTileName{font-weight:900;font-size:16px;line-height:1.18;color:#fff7e5}
    .menuTilePrice{flex:0 0 auto;border:1px solid rgba(159,211,169,.3);background:#112018;color:#bdf0c5;border-radius:8px;padding:6px 8px;font-weight:950;font-size:13px}
    .menuTileMeta{font-size:12px;color:#9fd3a9;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    @media (max-width:900px){
      .menuIntro{align-items:flex-start;flex-direction:column}
      .menuIntroMeta{justify-content:flex-start}
      .menuBoard{grid-template-columns:1fr}
      .menuSidebar{position:static}
      .menuSidebar #cats{display:flex;flex-direction:row;overflow-x:auto;padding-bottom:3px;scroll-snap-type:x proximity}
      .menuCat{flex:0 0 auto;min-width:136px;scroll-snap-align:start}
    }
    @media (max-width:560px){
      .wrap{padding:14px 10px 28px}
      .menuIntro{padding:14px}
      .menuGrid{grid-template-columns:1fr}
      .menuTile{display:grid;grid-template-columns:112px 1fr;align-items:stretch}
      .menuTileThumb{height:100%;min-height:112px}
      .menuTileHead{flex-direction:column}
      .menuTilePrice{width:max-content}
    }
    body[data-menu-mode="qr"] .topbar{display:none}
    body[data-menu-mode="qr"] .menuRequest{display:none}
    body[data-menu-mode="qr"] .wrap{padding-top:12px}
    body[data-menu-mode="qr-table"] .topbar{display:none}
    body[data-menu-mode="qr-table"] .wrap{padding-top:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand" id="resto">MENU</div>
        <div class="sub" id="sub">Catalogo</div>
      </div>
      <div class="right">
        <button id="langToggle" class="langBtn" type="button" aria-label="Idioma">EN</button>
        <a href="/profile.html" title="Acceso personal">Usuarios</a>
      </div>
    </div>

    <section class="menuIntro">
      <div>
        <div class="menuKicker" id="menuKicker">Carta</div>
        <h1 id="menuHeroTitle">Menu</h1>
        <p id="menuHeroText">Elegí tranquilo. Si estás en la mesa, podés pedir la cuenta desde acá.</p>
        <div class="menuContext">
          <div class="menuContextItem">
            <span id="restaurantContextLabel">Restaurante</span>
            <strong id="restaurantContextValue">-</strong>
          </div>
          <div class="menuContextItem">
            <span id="tableContextLabel">Mesa</span>
            <strong id="tableContextValue">-</strong>
          </div>
        </div>
      </div>
      <div class="menuIntroMeta">
        <div class="menuPill">Mesa <strong id="tablePill">-</strong></div>
        <div class="menuPill">Productos <strong id="heroCount">0</strong></div>
      </div>
    </section>

    <div class="menuBoard">
      <div class="menuSidebar">
        <div class="menuSideTitle">Rubros</div>
        <div id="cats"></div>
      </div>
      <div class="menuContent">
        <div class="menuTop">
          <div class="menuTitle" id="menuTitle">Todo</div>
          <div class="badge2">Productos <strong id="menuCount">0</strong></div>
        </div>
        <div class="menuGrid" id="grid"></div>
      </div>
    </div>

    <div class="card menuRequest">
      <div class="menuTitle" id="billTitle">Pedir la cuenta</div>
      <div class="menuTileDesc" id="billDesc">Avisamos al personal. Opcional: indica mesa o ubicacion.</div>
      <div class="row" style="margin-top:10px;">
        <input id="billTable" class="input" placeholder="Mesa (opcional)" style="flex:1; min-width:180px"/>
        <button id="btnBill" class="btn primary" type="button">Pedir</button>
      </div>
      <div class="muted" id="billHint" style="font-size:.85em; margin-top:8px;">No hace falta iniciar sesion.</div>
    </div>

    <div id="toast" class="toast" style="display:none"></div>
  </div>

  <script src="/app.js"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const tableParamRaw = qs.get('mesa') || qs.get('table') || '';
    const tableParam = tableParamRaw ? tableParamRaw.trim().slice(0, 40) : '';
    const restaurantParam = (qs.get('restaurantId') || qs.get('rest') || qs.get('r') || '').trim().slice(0, 80);
    const branchParam = (qs.get('branchId') || qs.get('branch') || qs.get('b') || '').trim().slice(0, 80);
    const qrMode = qs.get('qr') === '1' || qs.get('kiosk') === '1';
    if(qrMode){
      document.body.setAttribute('data-menu-mode', tableParam ? 'qr-table' : 'qr');
    }

    const $cats = document.getElementById('cats');
    const $grid = document.getElementById('grid');
    const $resto = document.getElementById('resto');
    const $sub = document.getElementById('sub');
    const $langToggle = document.getElementById('langToggle');
    const $menuTitle = document.getElementById('menuTitle');
    const $menuCount = document.getElementById('menuCount');
    const $heroCount = document.getElementById('heroCount');
    const $menuHeroTitle = document.getElementById('menuHeroTitle');
    const $menuHeroText = document.getElementById('menuHeroText');
    const $tablePill = document.getElementById('tablePill');
    const $restaurantContextValue = document.getElementById('restaurantContextValue');
    const $tableContextValue = document.getElementById('tableContextValue');
    const $billInput = document.getElementById('billTable');
    const $billHint = document.getElementById('billHint');

    if(tableParam && $billInput){
      $billInput.value = tableParam;
      if($billHint) $billHint.textContent = "Mesa detectada desde el QR.";
    }
    if($tablePill) $tablePill.textContent = tableParam || "-";
    if($tableContextValue) $tableContextValue.textContent = tableParam || "-";

    let state = {categories:[], products:[], currency:'ARS'};
    let currentCat = 'all';
    let lang = (localStorage.getItem('menu_lang') || 'es').toLowerCase() === 'en' ? 'en' : 'es';

    const i18n = {
      es: {
        all: "Todo",
        billTitle: "Pedir la cuenta",
        billDesc: "Avisamos al personal. Opcional: indica mesa o ubicacion.",
        billPlaceholder: "Mesa (opcional)",
        billBtn: "Pedir",
        billHint: "No hace falta iniciar sesion.",
        billSent: "Listo: avisamos al personal",
        billErr: "No se pudo enviar",
        menuFail: "No se pudo cargar el menu.",
        noProducts: "No hay productos en esta categoria.",
        catalog: "Catalogo",
        access: "Acceso",
        rubros: "Rubros",
        intro: "Elegí tranquilo. Si estás en la mesa, podés pedir la cuenta desde acá.",
        menuKicker: "Carta",
        restaurantLabel: "Restaurante",
        tableLabel: "Mesa"
      },
      en: {
        all: "All",
        billTitle: "Ask for the bill",
        billDesc: "We notify staff. Optional: add your table or location.",
        billPlaceholder: "Table (optional)",
        billBtn: "Request",
        billHint: "No login required.",
        billSent: "Done: we notified staff",
        billErr: "Could not send",
        menuFail: "Could not load the menu.",
        noProducts: "No products in this category.",
        catalog: "Catalog",
        access: "Access",
        rubros: "Categories",
        intro: "Take your time. If you are at the table, you can ask for the bill here.",
        menuKicker: "Menu",
        restaurantLabel: "Restaurant",
        tableLabel: "Table"
      }
    };

    function t(key){
      return (i18n[lang] && i18n[lang][key]) || (i18n.es && i18n.es[key]) || key;
    }

    function applyLang(){
      document.documentElement.lang = lang;
      const billTitle = document.getElementById('billTitle');
      if(billTitle) billTitle.textContent = t('billTitle');
      const billDesc = document.getElementById('billDesc');
      if(billDesc) billDesc.textContent = t('billDesc');
      const billHint = document.getElementById('billHint');
      if(billHint) billHint.textContent = t('billHint');
      const billInput = document.getElementById('billTable');
      if(billInput) billInput.placeholder = t('billPlaceholder');
      const billBtn = document.getElementById('btnBill');
      if(billBtn) billBtn.textContent = t('billBtn');
      const access = document.querySelector('.right a');
      if(access) access.textContent = t('access');
      if($langToggle) $langToggle.textContent = (lang === 'es' ? 'EN' : 'ES');
      if($sub) $sub.textContent = t('catalog');
      const rubroTitle = document.querySelector('.menuSideTitle');
      if(rubroTitle) rubroTitle.textContent = t('rubros');
      const kicker = document.getElementById('menuKicker');
      if(kicker) kicker.textContent = t('menuKicker');
      const restaurantLabel = document.getElementById('restaurantContextLabel');
      if(restaurantLabel) restaurantLabel.textContent = t('restaurantLabel');
      const tableLabel = document.getElementById('tableContextLabel');
      if(tableLabel) tableLabel.textContent = t('tableLabel');
      if($menuHeroText) $menuHeroText.textContent = t('intro');
    }

    const $toast = document.getElementById('toast');
    let toastTimer = null;
    function toast(msg){
      if(!$toast) return;
      $toast.textContent = String(msg||'');
      $toast.style.display = 'block';
      $toast.classList.add('show');
      if(toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ $toast.classList.remove('show'); $toast.style.display='none'; }, 2600);
    }

    async function requestBill(){
      const table = (document.getElementById('billTable')?.value || '').trim().slice(0,40);
      const btn = document.getElementById('btnBill');
      if(btn) btn.disabled = true;
      try{
        const r = await fetch('/api/customer/requestBill', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ table, restaurantId: restaurantParam, branchId: branchParam })
        });
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error((j && j.error) ? j.error : t('billErr'));
        toast(t('billSent') + (table ? (' - ' + table) : ''));
        const inp = document.getElementById('billTable');
        if(inp) inp.value = '';
      }catch(e){
        toast('Error: ' + (e.message || 'offline'));
      }finally{
        if(btn) btn.disabled = false;
      }
    }

    document.getElementById('btnBill')?.addEventListener('click', requestBill);

    function money(n){
      const v = Number(n||0);
      return v.toLocaleString('es-AR', { style:'currency', currency: state.currency || 'ARS', maximumFractionDigits:0 });
    }

    function catTitle(c){
      if(!c) return '';
      if(lang === 'en' && c.titleEn) return c.titleEn;
      return c.title || '';
    }

    function hexToRgba(hex, alpha){
      const h = String(hex || '').trim().replace('#', '');
      if(h.length === 3){
        const r = parseInt(h[0]+h[0], 16);
        const g = parseInt(h[1]+h[1], 16);
        const b = parseInt(h[2]+h[2], 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }
      if(h.length === 6){
        const r = parseInt(h.slice(0,2), 16);
        const g = parseInt(h.slice(2,4), 16);
        const b = parseInt(h.slice(4,6), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }
      return '';
    }

    function catStyle(color){
      const bg = hexToRgba(color, 0.12);
      const border = hexToRgba(color, 0.5);
      const ring = hexToRgba(color, 0.25);
      if(!bg || !border) return '';
      return `--cat-bg:${bg}; --cat-border:${border}; --cat-ring:${ring};`;
    }

    function renderCats(){
      const counts = new Map();
      (state.products||[]).forEach(p=>{
        const key = String(p.categoryId || '');
        counts.set(key, (counts.get(key) || 0) + 1);
      });
      const cats = [{id:'all', title:t('all')}].concat(state.categories||[]);
      $cats.innerHTML = cats.map(c => {
        const active = (c.id === currentCat) ? 'active' : '';
        const style = (c.id !== 'all' && c.color) ? ` style="${catStyle(c.color)}"` : '';
        const count = c.id === 'all' ? (state.products||[]).length : (counts.get(String(c.id)) || 0);
        return `<button class="menuCat ${active}" type="button" data-id="${c.id}"${style}><span>${catTitle(c)}</span><strong>${count}</strong></button>`;
      }).join('');
      [...$cats.querySelectorAll('.menuCat')].forEach(el => {
        el.addEventListener('click', () => {
          currentCat = el.getAttribute('data-id') || 'all';
          renderCats();
          renderGrid();
        });
      });
    }

    function renderGrid(){
      const list = (state.products||[]).filter(p => currentCat==='all' || String(p.categoryId||'')===String(currentCat));
      if($menuCount) $menuCount.textContent = String(list.length);
      if($heroCount) $heroCount.textContent = String((state.products||[]).length);
      if (!list.length){
        $grid.innerHTML = `<div class="menuEmpty small muted">${t('noProducts')}</div>`;
        return;
      }
      const catMap = new Map((state.categories||[]).map(c=>[String(c.id), c]));
      const currentCatObj = catMap.get(String(currentCat));
      const title = currentCat === 'all' ? t('all') : (currentCatObj ? catTitle(currentCatObj) : t('all'));
      if($menuTitle) $menuTitle.textContent = title;

      $grid.innerHTML = list.map(p => {
        const catObj = catMap.get(String(p.categoryId||""));
        const catLabel = catObj ? catTitle(catObj) : "Otros";
        const desc = (lang==='en' && p.descriptionEn) ? p.descriptionEn : p.description;
        const name = (lang==='en' && p.nameEn) ? p.nameEn : p.name;
        const initial = String(name || "P").trim().slice(0, 1).toUpperCase();
        const thumb = p.imageUrl
          ? `<div class="menuTileThumb" style="background-image:url('${escapeHtml(p.imageUrl)}')" aria-label="${escapeHtml(name)}"></div>`
          : `<div class="menuTileThumb" aria-hidden="true">${escapeHtml(initial)}</div>`;
        return `
          <div class="menuTile">
            ${thumb}
            <div class="menuTileInfo">
              <div class="menuTileMeta">${escapeHtml(catLabel)}</div>
              <div class="menuTileHead">
                <div class="menuTileName">${escapeHtml(name)}</div>
                <div class="menuTilePrice">${money(p.price)}</div>
              </div>
              ${desc ? `<div class="menuTileDesc">${escapeHtml(desc)}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function boot(){
      try{
        const params = new URLSearchParams();
        if(restaurantParam) params.set('restaurantId', restaurantParam);
        if(branchParam) params.set('branchId', branchParam);
        const publicMenuUrl = '/api/public/menu' + (params.toString() ? ('?' + params.toString()) : '');
        const r = await fetch(publicMenuUrl, { cache:'no-store' });
        const data = await r.json();
        state = data;
        document.title = `${lang === 'en' ? 'Menu' : 'Menu'} - ${data.restaurantName || 'NEXA'}`;
        const restaurantName = data.restaurantName || 'Menu';
        $resto.textContent = restaurantName.toUpperCase();
        if($menuHeroTitle) $menuHeroTitle.textContent = restaurantName;
        if($restaurantContextValue) $restaurantContextValue.textContent = restaurantName;
        $sub.textContent = t('catalog');
        applyLang();
        renderCats();
        renderGrid();
      }catch(e){
        $grid.innerHTML = `<div class="menuEmpty small muted">${t('menuFail')}</div>`;
      }
    }

    if($langToggle){
      $langToggle.addEventListener('click', ()=>{
        lang = (lang === 'es') ? 'en' : 'es';
        localStorage.setItem('menu_lang', lang);
        applyLang();
        renderCats();
        renderGrid();
        document.title = `${lang === 'en' ? 'Menu' : 'Menu'} - ${state.restaurantName || 'NEXA'}`;
      });
    }

    applyLang();
    boot();
  </script>
</body>
</html>
