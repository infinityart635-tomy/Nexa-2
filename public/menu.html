<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Menu - NEXA</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body{background:#111214;color:#f7f3e8}
    .wrap{max-width:1180px;margin:0 auto;padding:22px 16px 40px}
    .topbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:14px}
    .topbar > div:first-child{display:none}
    .brand{font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .sub{color:#b7b0a3;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    .muted{color:var(--muted)}
    .right{display:flex;align-items:center;gap:10px}
    .right a{color:#d8cfbd;text-decoration:none}
    .right a:hover{color:#fff7e5}
    .langBtn{border:1px solid rgba(247,243,232,.18);background:#191a1d;color:#fff7e5;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:800;letter-spacing:.04em}
    #notifDock{display:none !important}
    .menuIntro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px;padding:18px;border:1px solid rgba(247,243,232,.12);border-radius:8px;background:linear-gradient(135deg,#17181b,#20211f 58%,#1c2420)}
    .menuKicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9fd3a9;font-weight:900}
    .menuIntro h1{margin:6px 0 0;font-size:clamp(28px,6vw,56px);line-height:.95;letter-spacing:0;text-transform:none;color:#fff7e5}
    .menuContext{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .menuContextItem{border:1px solid rgba(247,243,232,.12);background:#111214;border-radius:8px;padding:9px 11px;color:#d7cfbf;font-size:13px}
    .menuContextItem span{display:block;color:#9fd3a9;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:950;margin-bottom:3px}
    .menuContextItem strong{color:#fff7e5;font-size:14px}
    .menuTileDesc{color:#c7beb0;font-size:12px;line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .menuEmpty{padding:18px;border:1px dashed rgba(247,243,232,.18);border-radius:8px;background:#17181b;color:#d7cfbf}
    .menuBoard{grid-template-columns:210px 1fr;gap:14px}
    .menuSidebar{border-radius:8px;background:#17181b;border-color:rgba(247,243,232,.12);padding:12px;box-shadow:none}
    .menuSidebar #cats{display:flex;flex-direction:column;gap:8px}
    .menuSideTitle{color:#9fd3a9;font-weight:900;letter-spacing:.16em}
    .menuCat{border-radius:8px;padding:12px;border-color:var(--cat-border, rgba(247,243,232,.12));background:var(--cat-bg, #202124);box-shadow:none;font-weight:850;color:#fff7e5;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .menuCat span{overflow:hidden;text-overflow:ellipsis}
    .menuCat.active{box-shadow:0 0 0 2px var(--cat-ring, rgba(159,211,169,.14));background:#24251f}
    .menuContent{border-radius:8px;background:#151619;border-color:rgba(247,243,232,.12);padding:14px;box-shadow:none}
    .menuTop{border-bottom:1px solid rgba(247,243,232,.1);padding-bottom:12px}
    .menuTitle{font-size:14px;letter-spacing:.12em;color:#fff7e5}
    .menuGrid{margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
    .menuTile{border-radius:8px;background:#1b1c1f;border-color:rgba(247,243,232,.12);box-shadow:none;padding:8px;gap:8px;min-height:0;overflow:hidden;cursor:pointer;text-align:left;width:100%;color:inherit}
    .menuTile:focus{outline:2px solid rgba(159,211,169,.55);outline-offset:2px}
    .menuTileThumb{height:104px;border-radius:8px;border:1px solid rgba(247,243,232,.12);background:#252622;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#9fd3a9;font-weight:950;font-size:28px}
    .menuTileInfo{display:flex;flex-direction:column;gap:5px}
    .menuTileHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .menuTileName{font-weight:900;font-size:14px;line-height:1.15;color:#fff7e5}
    .menuTilePrice{flex:0 0 auto;border:1px solid rgba(159,211,169,.3);background:#112018;color:#bdf0c5;border-radius:8px;padding:5px 7px;font-weight:950;font-size:12px}
    .menuTileMeta{font-size:10px;color:#9fd3a9;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    .productModal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.68)}
    .productModal.open{display:flex}
    .productPanel{width:min(560px,100%);max-height:92vh;overflow:auto;border:1px solid rgba(247,243,232,.16);border-radius:8px;background:#17181b;color:#fff7e5;box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .productHero{height:280px;background:#252622;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#9fd3a9;font-weight:950;font-size:58px}
    .productBody{padding:14px;display:flex;flex-direction:column;gap:10px}
    .productTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .productTitle{font-size:24px;line-height:1.05;font-weight:950}
    .productPrice{border:1px solid rgba(159,211,169,.3);background:#112018;color:#bdf0c5;border-radius:8px;padding:8px 10px;font-weight:950}
    .productCat{font-size:11px;color:#9fd3a9;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
    .productDesc{color:#d7cfbf;line-height:1.45}
    .productClose{width:100%;border-radius:8px}
    @media (max-width:900px){
      .menuIntro{align-items:flex-start;flex-direction:column}
      .menuBoard{grid-template-columns:1fr}
      .menuSidebar{position:static}
      .menuSidebar #cats{display:flex;flex-direction:row;overflow-x:auto;padding-bottom:3px;scroll-snap-type:x proximity}
      .menuCat{flex:0 0 auto;min-width:136px;scroll-snap-align:start}
    }
    @media (max-width:560px){
      .wrap{padding:14px 10px 28px}
      .menuIntro{padding:14px}
      .menuGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .menuTile{padding:7px}
      .menuTileThumb{height:94px}
      .menuTileHead{flex-direction:column}
      .menuTilePrice{width:max-content}
      .menuTileDesc{display:none}
      .productHero{height:240px}
    }
    body[data-menu-mode="qr"] .topbar{display:none}
    body[data-menu-mode="qr"] .wrap{padding-top:12px}
    body[data-menu-mode="qr-table"] .topbar{display:none}
    body[data-menu-mode="qr-table"] .wrap{padding-top:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand" id="resto">MENU</div>
        <div class="sub" id="sub">Catalogo</div>
      </div>
      <div class="right">
        <button id="langToggle" class="langBtn" type="button" aria-label="Idioma">EN</button>
        <a href="/profile.html" title="Acceso personal">Usuarios</a>
      </div>
    </div>

    <section class="menuIntro">
      <div>
        <div class="menuKicker" id="menuKicker">Carta</div>
        <h1 id="menuHeroTitle">Menu</h1>
        <div class="menuContext">
          <div class="menuContextItem">
            <span id="tableContextLabel">Mesa</span>
            <strong id="tableContextValue">-</strong>
          </div>
        </div>
      </div>
    </section>

    <div class="menuBoard">
      <div class="menuSidebar">
        <div class="menuSideTitle">Rubros</div>
        <div id="cats"></div>
      </div>
      <div class="menuContent">
        <div class="menuTop">
          <div class="menuTitle" id="menuTitle">Todo</div>
        </div>
        <div class="menuGrid" id="grid"></div>
      </div>
    </div>

    <div class="productModal" id="productModal" aria-hidden="true">
      <div class="productPanel" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
        <div class="productHero" id="productModalHero"></div>
        <div class="productBody">
          <div class="productCat" id="productModalCat"></div>
          <div class="productTop">
            <div class="productTitle" id="productModalTitle"></div>
            <div class="productPrice" id="productModalPrice"></div>
          </div>
          <div class="productDesc" id="productModalDesc"></div>
          <button class="btn productClose" id="productModalClose" type="button">Cerrar</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" style="display:none"></div>
  </div>

  <script src="/app.js"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const tableParamRaw = qs.get('mesa') || qs.get('table') || '';
    const tableParam = tableParamRaw ? tableParamRaw.trim().slice(0, 40) : '';
    const restaurantParam = (qs.get('restaurantId') || qs.get('rest') || qs.get('r') || '').trim().slice(0, 80);
    const branchParam = (qs.get('branchId') || qs.get('branch') || qs.get('b') || '').trim().slice(0, 80);
    const qrMode = qs.get('qr') === '1' || qs.get('kiosk') === '1';
    if(qrMode){
      document.body.setAttribute('data-menu-mode', tableParam ? 'qr-table' : 'qr');
    }

    const $cats = document.getElementById('cats');
    const $grid = document.getElementById('grid');
    const $resto = document.getElementById('resto');
    const $sub = document.getElementById('sub');
    const $langToggle = document.getElementById('langToggle');
    const $menuTitle = document.getElementById('menuTitle');
    const $menuHeroTitle = document.getElementById('menuHeroTitle');
    const $tableContextValue = document.getElementById('tableContextValue');
    const $productModal = document.getElementById('productModal');
    const $productModalHero = document.getElementById('productModalHero');
    const $productModalCat = document.getElementById('productModalCat');
    const $productModalTitle = document.getElementById('productModalTitle');
    const $productModalPrice = document.getElementById('productModalPrice');
    const $productModalDesc = document.getElementById('productModalDesc');
    const $productModalClose = document.getElementById('productModalClose');

    if($tableContextValue) $tableContextValue.textContent = tableParam || "-";

    let state = {categories:[], products:[], currency:'ARS'};
    let currentCat = 'all';
    let lang = (localStorage.getItem('menu_lang') || 'es').toLowerCase() === 'en' ? 'en' : 'es';

    const i18n = {
      es: {
        all: "Todo",
        menuFail: "No se pudo cargar el menu.",
        noProducts: "No hay productos en esta categoria.",
        catalog: "Catalogo",
        access: "Acceso",
        rubros: "Rubros",
        menuKicker: "Carta",
        tableLabel: "Mesa",
        close: "Cerrar"
      },
      en: {
        all: "All",
        menuFail: "Could not load the menu.",
        noProducts: "No products in this category.",
        catalog: "Catalog",
        access: "Access",
        rubros: "Categories",
        menuKicker: "Menu",
        tableLabel: "Table",
        close: "Close"
      }
    };

    function t(key){
      return (i18n[lang] && i18n[lang][key]) || (i18n.es && i18n.es[key]) || key;
    }

    function applyLang(){
      document.documentElement.lang = lang;
      const access = document.querySelector('.right a');
      if(access) access.textContent = t('access');
      if($langToggle) $langToggle.textContent = (lang === 'es' ? 'EN' : 'ES');
      if($sub) $sub.textContent = t('catalog');
      const rubroTitle = document.querySelector('.menuSideTitle');
      if(rubroTitle) rubroTitle.textContent = t('rubros');
      const kicker = document.getElementById('menuKicker');
      if(kicker) kicker.textContent = t('menuKicker');
      const tableLabel = document.getElementById('tableContextLabel');
      if(tableLabel) tableLabel.textContent = t('tableLabel');
      if($productModalClose) $productModalClose.textContent = t('close');
    }

    const $toast = document.getElementById('toast');
    let toastTimer = null;
    function toast(msg){
      if(!$toast) return;
      $toast.textContent = String(msg||'');
      $toast.style.display = 'block';
      $toast.classList.add('show');
      if(toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ $toast.classList.remove('show'); $toast.style.display='none'; }, 2600);
    }

    function money(n){
      const v = Number(n||0);
      return v.toLocaleString('es-AR', { style:'currency', currency: state.currency || 'ARS', maximumFractionDigits:0 });
    }

    function catTitle(c){
      if(!c) return '';
      if(lang === 'en' && c.titleEn) return c.titleEn;
      return c.title || '';
    }

    function hexToRgba(hex, alpha){
      const h = String(hex || '').trim().replace('#', '');
      if(h.length === 3){
        const r = parseInt(h[0]+h[0], 16);
        const g = parseInt(h[1]+h[1], 16);
        const b = parseInt(h[2]+h[2], 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }
      if(h.length === 6){
        const r = parseInt(h.slice(0,2), 16);
        const g = parseInt(h.slice(2,4), 16);
        const b = parseInt(h.slice(4,6), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }
      return '';
    }

    function catStyle(color){
      const bg = hexToRgba(color, 0.12);
      const border = hexToRgba(color, 0.5);
      const ring = hexToRgba(color, 0.25);
      if(!bg || !border) return '';
      return `--cat-bg:${bg}; --cat-border:${border}; --cat-ring:${ring};`;
    }

    function getProductView(p){
      const catMap = new Map((state.categories||[]).map(c=>[String(c.id), c]));
      const catObj = catMap.get(String(p && p.categoryId || ""));
      const name = (lang==='en' && p && p.nameEn) ? p.nameEn : (p && p.name) || "";
      const desc = (lang==='en' && p && p.descriptionEn) ? p.descriptionEn : (p && p.description) || "";
      return {
        name,
        desc,
        catLabel: catObj ? catTitle(catObj) : ((p && p.categoryTitle) || "Otros"),
        initial: String(name || "P").trim().slice(0, 1).toUpperCase(),
        imageUrl: String((p && p.imageUrl) || ""),
        price: money(p && p.price)
      };
    }

    function openProduct(productId){
      const product = (state.products || []).find(p => String(p.id || "") === String(productId || ""));
      if(!product || !$productModal) return;
      const view = getProductView(product);
      if($productModalHero){
        $productModalHero.textContent = view.imageUrl ? "" : view.initial;
        $productModalHero.style.backgroundImage = view.imageUrl ? `url('${view.imageUrl.replace(/'/g, "%27")}')` : "";
      }
      if($productModalCat) $productModalCat.textContent = view.catLabel;
      if($productModalTitle) $productModalTitle.textContent = view.name;
      if($productModalPrice) $productModalPrice.textContent = view.price;
      if($productModalDesc) $productModalDesc.textContent = view.desc || "";
      $productModal.classList.add("open");
      $productModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      if($productModalClose) $productModalClose.focus();
    }

    function closeProduct(){
      if(!$productModal) return;
      $productModal.classList.remove("open");
      $productModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function renderCats(){
      const cats = [{id:'all', title:t('all')}].concat(state.categories||[]);
      $cats.innerHTML = cats.map(c => {
        const active = (c.id === currentCat) ? 'active' : '';
        const style = (c.id !== 'all' && c.color) ? ` style="${catStyle(c.color)}"` : '';
        return `<button class="menuCat ${active}" type="button" data-id="${c.id}"${style}><span>${catTitle(c)}</span></button>`;
      }).join('');
      [...$cats.querySelectorAll('.menuCat')].forEach(el => {
        el.addEventListener('click', () => {
          currentCat = el.getAttribute('data-id') || 'all';
          renderCats();
          renderGrid();
        });
      });
    }

    function renderGrid(){
      const list = (state.products||[]).filter(p => currentCat==='all' || String(p.categoryId||'')===String(currentCat));
      if (!list.length){
        $grid.innerHTML = `<div class="menuEmpty small muted">${t('noProducts')}</div>`;
        return;
      }
      const catMap = new Map((state.categories||[]).map(c=>[String(c.id), c]));
      const currentCatObj = catMap.get(String(currentCat));
      const title = currentCat === 'all' ? t('all') : (currentCatObj ? catTitle(currentCatObj) : t('all'));
      if($menuTitle) $menuTitle.textContent = title;

      $grid.innerHTML = list.map(p => {
        const view = getProductView(p);
        const thumb = view.imageUrl
          ? `<div class="menuTileThumb" style="background-image:url('${escapeHtml(view.imageUrl)}')" aria-label="${escapeHtml(view.name)}"></div>`
          : `<div class="menuTileThumb" aria-hidden="true">${escapeHtml(view.initial)}</div>`;
        return `
          <button class="menuTile" type="button" data-product="${escapeHtml(p.id)}">
            ${thumb}
            <div class="menuTileInfo">
              <div class="menuTileMeta">${escapeHtml(view.catLabel)}</div>
              <div class="menuTileHead">
                <div class="menuTileName">${escapeHtml(view.name)}</div>
                <div class="menuTilePrice">${view.price}</div>
              </div>
              ${view.desc ? `<div class="menuTileDesc">${escapeHtml(view.desc)}</div>` : ''}
            </div>
          </button>
        `;
      }).join('');
      [...$grid.querySelectorAll("[data-product]")].forEach(btn=>{
        btn.addEventListener("click", ()=>openProduct(btn.getAttribute("data-product") || ""));
      });
    }

    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function boot(){
      try{
        const params = new URLSearchParams();
        if(restaurantParam) params.set('restaurantId', restaurantParam);
        if(branchParam) params.set('branchId', branchParam);
        const publicMenuUrl = '/api/public/menu' + (params.toString() ? ('?' + params.toString()) : '');
        const r = await fetch(publicMenuUrl, { cache:'no-store' });
        const data = await r.json();
        state = data;
        document.title = `${lang === 'en' ? 'Menu' : 'Menu'} - ${data.restaurantName || 'NEXA'}`;
        const restaurantName = data.restaurantName || 'Menu';
        $resto.textContent = restaurantName.toUpperCase();
        if($menuHeroTitle) $menuHeroTitle.textContent = restaurantName;
        $sub.textContent = t('catalog');
        applyLang();
        renderCats();
        renderGrid();
      }catch(e){
        $grid.innerHTML = `<div class="menuEmpty small muted">${t('menuFail')}</div>`;
      }
    }

    if($langToggle){
      $langToggle.addEventListener('click', ()=>{
        lang = (lang === 'es') ? 'en' : 'es';
        localStorage.setItem('menu_lang', lang);
        applyLang();
        renderCats();
        renderGrid();
        document.title = `${lang === 'en' ? 'Menu' : 'Menu'} - ${state.restaurantName || 'NEXA'}`;
      });
    }

    if($productModalClose) $productModalClose.addEventListener("click", closeProduct);
    if($productModal){
      $productModal.addEventListener("click", (event)=>{
        if(event.target === $productModal) closeProduct();
      });
    }
    window.addEventListener("keydown", (event)=>{
      if(event.key === "Escape") closeProduct();
    });

    applyLang();
    boot();
  </script>
</body>
</html>
