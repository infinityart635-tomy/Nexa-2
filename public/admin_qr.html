<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#121212"/>
  <title>NEXA - QR Mesas</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    html{overflow:auto}
    body.qrAdmin{overflow:auto;min-height:100dvh}
    body.qrAdmin > .top .wrap{max-width:none;width:100%;padding-left:18px;padding-right:18px}
    body.qrAdmin > main.wrap{max-width:none;width:100%;height:auto;min-height:calc(100dvh - var(--app-top-height));overflow:visible;padding:18px 24px 34px}
    .qrPage{display:flex;flex-direction:column;gap:18px}
    .qrHeroCard{padding:18px;border-radius:8px;background:linear-gradient(180deg, rgba(24,25,29,.96), rgba(17,18,22,.96));border:1px solid rgba(255,255,255,.10);box-shadow:none}
    .qrHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:16px}
    .qrHeader .h2{font-size:18px;letter-spacing:.08em;text-transform:uppercase}
    .qrGeneralGrid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:16px}
    .qrGrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:4px}
    .qrCard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px;border-radius:8px;background:#17181c;border:1px solid rgba(255,255,255,.10);box-shadow:none;min-width:0}
    .qrImg{width:220px;height:220px;max-width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:#fff;padding:8px;object-fit:contain}
    .qrTitle{font-weight:900;font-size:15px;letter-spacing:.04em}
    .qrMeta{display:none}
    .qrActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
    .qrControls{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
    @media (max-width:760px){
      body.qrAdmin > main.wrap{padding:12px}
      .qrHeader{flex-direction:column}
      .qrGeneralGrid{grid-template-columns:1fr}
      .qrImg{width:190px;height:190px}
    }
    @media print{
      header.top,.qrControls,#qrHint{display:none !important;}
      body{background:#fff; color:#111;}
      .wrap{max-width:none; padding:0 10px;}
      .card{box-shadow:none; border:1px solid #ddd;}
    }
  </style>
</head>
<body class="qrAdmin">
  <header class="top">
    <div class="wrap" style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;">
      <div class="brand">
        <div>
          <h1>NEXA</h1>
          <p>QR por mesa</p>
        </div>
      </div>
      <nav class="megaNav">
        <div class="navGroup">
          <div class="navLabel">Operacion</div>
          <a class="pill" href="/mozo_prints.html">Mozo &#128424;</a>
          <a class="pill" href="/cocina.html">Cocina</a>
          <a class="pill" href="/salon_pc.html">Salon</a>
        </div>
        <div class="navGroup">
          <div class="navLabel">Catalogo</div>
          <a class="pill" href="/menu.html">Carta</a>
          <a class="pill" href="/admin_productos.html">Carta/Productos</a>
          <a class="pill" href="/admin_proveedores.html">Compras</a>
          <a class="pill" href="/admin_qr.html">QR Mesas</a>
        </div>
        <div class="navGroup">
          <div class="navLabel">Gestion</div>
          <a class="pill" href="/admin_caja_test.html">Caja/Cierre</a>
          <a class="pill" href="/admin_fiscal_test.html">Comprobantes</a>
          <a class="pill" href="/admin_stats.html">Estadisticas</a>
        </div>
        <div class="navGroup navProfile navPerfil">
          <a class="pill icon" href="/profile.html" title="Usuarios" aria-label="Usuarios">&#128100;</a>
          <a class="pill icon" href="/config.html" title="Ajustes" aria-label="Ajustes">&#9881;</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="qrPage">
    <section class="qrHeroCard">
      <div class="qrHeader">
        <div>
          <div class="h2">QR generales</div>
          <div class="mini muted">Menu cliente y acceso Mozo</div>
        </div>
        <button id="btnDownload" class="btn" type="button">Descargar todos</button>
      </div>
      <div class="qrGeneralGrid">
        <div class="qrCard">
          <div class="qrTitle">QR Carta</div>
          <img id="qrMenuImg" class="qrImg" alt="QR Carta" width="180" height="180"/>
          <a id="qrMenuDl" class="btn" download="qr-carta.png">Descargar PNG</a>
        </div>
        <div class="qrCard">
          <div class="qrTitle">QR Mozo</div>
          <img id="qrMozoImg" class="qrImg" alt="QR Mozo" width="180" height="180"/>
          <a id="qrMozoDl" class="btn" download="qr-mozo.png">Descargar PNG</a>
        </div>
      </div>
    </section>

    <div id="qrStatus" class="mini muted" style="margin-top:10px;"></div>
    <div id="qrGrid" class="qrGrid"></div>
    </div>
  </main>

  <script>
    const $ = (id)=>document.getElementById(id);
    const qrGrid = $("qrGrid");
    const qrStatus = $("qrStatus");
    const qrBase = $("qrBase");
    const qrBaseInput = $("qrBaseInput");
    let baseUrl = "";
    let tables = [];
    let restaurantId = "";
    let branchId = "";

    function normalizeBaseUrl(raw){
      const v = String(raw || "").trim();
      if (!v) return "";
      if (/^https?:\/\//i.test(v)) return v.replace(/\/+$/,"");
      return ("http://" + v).replace(/\/+$/,"");
    }

    function isPrivateBaseUrl(raw){
      try{
        const u = new URL(String(raw || ""));
        const h = u.hostname.toLowerCase();
        return h === "localhost" ||
          h === "127.0.0.1" ||
          h.startsWith("127.") ||
          h.startsWith("10.") ||
          h.startsWith("192.168.") ||
          /^172\.(1[6-9]|2\d|3[01])\./.test(h);
      }catch(e){
        return false;
      }
    }

    function getBaseOverride(){
      const params = new URLSearchParams(location.search);
      const fromQuery = normalizeBaseUrl(params.get("base"));
      const publicHttps = location && location.protocol === "https:";
      if (fromQuery) {
        if(publicHttps && isPrivateBaseUrl(fromQuery)){
          localStorage.removeItem("qrBaseUrl");
          return "";
        }
        localStorage.setItem("qrBaseUrl", fromQuery);
        return fromQuery;
      }
      const saved = normalizeBaseUrl(localStorage.getItem("qrBaseUrl"));
      if(publicHttps && isPrivateBaseUrl(saved)){
        localStorage.removeItem("qrBaseUrl");
        return "";
      }
      return saved;
    }

    function pickBaseUrl(info){
      const override = getBaseOverride();
      if (override) return override;
      const origin = (location && location.origin) ? location.origin : "";
      const pref = info && info.preferred ? String(info.preferred) : "";
      const urls = (info && Array.isArray(info.urls)) ? info.urls.map(String) : [];
      const candidates = [origin, pref, ...urls].filter(Boolean);
      return candidates.find(u=>!isPrivateBaseUrl(u)) || candidates[0] || "";
    }

    function esc(str){
      return String(str || "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      })[m]);
    }

    function getTableLabel(t){
      return (t && t.name) ? t.name : (t && t.id ? t.id : "");
    }

    function buildMenuUrl(tableLabel){
      const params = new URLSearchParams();
      params.set("qr", "1");
      if(restaurantId) params.set("restaurantId", restaurantId);
      if(branchId) params.set("branchId", branchId);
      if(tableLabel) params.set("mesa", tableLabel);
      return baseUrl + "/menu.html?" + params.toString();
    }

    function buildGroups(list, groupLinks){
      const ordered = Array.isArray(list) ? list.filter(t=>t && t.id) : [];
      const map = new Map(ordered.map(t=>[String(t.id), t]));
      if(!groupLinks){
        return ordered.map(t=>({ tables:[t] }));
      }
      const visited = new Set();
      const groups = [];
      for (const t of ordered){
        const id = String(t.id);
        if(visited.has(id)) continue;
        const stack = [id];
        const group = [];
        while(stack.length){
          const cur = stack.pop();
          if(visited.has(cur)) continue;
          visited.add(cur);
          const item = map.get(cur);
          if(!item) continue;
          group.push(item);
          const links = Array.isArray(item.links) ? item.links.map(String) : [];
          for (const l of links){
            if(map.has(l) && !visited.has(l)) stack.push(l);
          }
        }
        if(group.length) groups.push({ tables: group });
      }
      return groups;
    }

    function renderQrs(){
      if(!qrGrid) return;
      if(!baseUrl){
        qrGrid.innerHTML = "";
        if(qrStatus) qrStatus.textContent = "No se pudo detectar la URL base.";
        return;
      }
      const groupLinks = $("groupLinks") ? $("groupLinks").checked : true;
      const groups = buildGroups(tables, groupLinks);
      if(!groups.length){
        qrGrid.innerHTML = "";
        if(qrStatus) qrStatus.textContent = "No hay mesas cargadas.";
        return;
      }
      if(qrStatus) qrStatus.textContent = groups.length + " QR generados.";
      qrGrid.innerHTML = groups.map((g, idx)=>{
        const names = g.tables.map(getTableLabel).filter(Boolean);
        const label = names.join(" + ");
        const safeLabel = label ? label.slice(0, 40) : ("Mesa " + (idx + 1));
        const menuUrl = buildMenuUrl(safeLabel);
        const qrSrc = "/qr.png?u=" + encodeURIComponent(menuUrl);
        const fileName = ("qr-" + safeLabel.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") + ".png");
        return `
          <div class="qrCard">
            <div class="qrTitle">${esc(label || safeLabel)}</div>
            <img class="qrImg" src="${qrSrc}" alt="QR ${esc(label || safeLabel)}" width="180" height="180"/>
            <div class="qrActions">
              <a class="btn" href="${qrSrc}" download="${esc(fileName)}">Descargar PNG</a>
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadData(){
      try{
        const info = await fetch("/api/info", {cache:"no-store"}).then(r=>r.json());
        const me = await fetch("/api/auth/me", {cache:"no-store"}).then(r=>r.json()).catch(()=>null);
        restaurantId = me && me.restaurantId ? String(me.restaurantId) : "";
        branchId = me && me.branchId ? String(me.branchId) : "";
        baseUrl = pickBaseUrl(info) || ("http://localhost:" + info.port);
        if (qrBaseInput) qrBaseInput.value = getBaseOverride() || baseUrl;
        if(qrBase) qrBase.textContent = "URL base: " + baseUrl;
        const menuUrl = buildMenuUrl("");
        const mozoUrl = baseUrl + "/login.html?role=mozo&next=" + encodeURIComponent("/mozo.html");
        const qrMenuImg = $("qrMenuImg");
        const qrMozoImg = $("qrMozoImg");
        const qrMenuDl = $("qrMenuDl");
        const qrMozoDl = $("qrMozoDl");
        if(qrMenuImg) qrMenuImg.src = "/qr.png?u=" + encodeURIComponent(menuUrl);
        if(qrMozoImg) qrMozoImg.src = "/qr.png?u=" + encodeURIComponent(mozoUrl);
        if(qrMenuDl) qrMenuDl.href = "/qr.png?u=" + encodeURIComponent(menuUrl);
        if(qrMozoDl) qrMozoDl.href = "/qr.png?u=" + encodeURIComponent(mozoUrl);
      }catch(e){
        baseUrl = "";
      }
      try{
        const r = await fetch("/api/state", {cache:"no-store"});
        if(!r.ok) throw new Error("unauthorized");
        const db = await r.json();
        tables = Array.isArray(db.tables) ? db.tables : [];
      }catch(e){
        tables = [];
        if(qrStatus) qrStatus.textContent = "Necesitas iniciar sesion como mozo/admin para ver las mesas.";
      }
    }

    $("btnGenerate")?.addEventListener("click", async ()=>{
      await loadData();
      renderQrs();
    });

    $("btnBaseSave")?.addEventListener("click", ()=>{
      const next = normalizeBaseUrl(qrBaseInput ? qrBaseInput.value : "");
      if (next) {
        localStorage.setItem("qrBaseUrl", next);
      } else {
        localStorage.removeItem("qrBaseUrl");
      }
      loadData().then(renderQrs);
    });

    $("btnBaseClear")?.addEventListener("click", ()=>{
      localStorage.removeItem("qrBaseUrl");
      if (qrBaseInput) qrBaseInput.value = "";
      loadData().then(renderQrs);
    });

    $("btnDownload")?.addEventListener("click", ()=>{
      if(!qrGrid || !qrGrid.children.length){
        alert("Primero genera los QR.");
        return;
      }
      window.print();
    });

    (async ()=>{
      await loadData();
      renderQrs();
    })();
  </script>
  <script src="/app.js"></script>
</body>
</html>
